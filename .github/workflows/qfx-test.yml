
name: QFX API Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-qfx:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check QFX API
        run: |
          code=$(curl --silent --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 20 \
            "https://website-api.qfxcinemas.com/api/v3/external/movie-shows/723") || code="NETWORK_ERROR"

          echo "QFX HTTP status: $code"
