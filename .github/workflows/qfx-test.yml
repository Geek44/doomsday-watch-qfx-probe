
name: QFX API Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Inspect QFX response
        shell: bash
        run: |
          code=$(curl --silent --show-error \
            --max-time 20 \
            --dump-header headers.txt \
            --output body.txt \
            --write-out "%{http_code}" \
            "https://website-api.qfxcinemas.com/api/v3/external/movie-shows/723") || code="NETWORK_ERROR"

          echo "HTTP status: $code"
          echo "Response headers:"
          grep -iE '^(server|content-type|cf-ray):' headers.txt || true

          echo "Response classification:"
          if grep -Eqi 'just a moment|challenge-platform|checking your browser' body.txt; then
            echo "Possible browser security challenge"
          elif grep -Eqi 'access denied|forbidden|blocked' body.txt; then
            echo "Access denied response"
          elif grep -Eq '^[[:space:]]*[\{\[]' body.txt; then
            echo "Possible JSON response"
          else
            echo "Unrecognized response"
          fi
